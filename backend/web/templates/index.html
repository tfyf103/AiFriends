{% load static %}

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="{% static 'frontend/favicon.ico' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiFriends</title>

    {% for css_file in css %}
      <link rel="stylesheet" crossorigin href="{% static css_file %}">
    {% endfor %}

    {% if js %}
      <script type="module" crossorigin src="{% static js %}"></script>
    {% endif %}
  </head>
  <body>
    <div id="app"></div>

    {% if not js %}
      <noscript>AiFriends 前端尚未构建，请先在 frontend 目录运行 npm run build。</noscript>
    {% endif %}
  </body>
</html>
