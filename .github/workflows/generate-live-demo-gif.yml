name: Generate Live Demo GIF

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/internationalization-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: pip install pillow==12.2.0
      - name: Build walkthrough GIF from real screenshots
        run: python scripts/build_demo_gif.py
      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/live-demo/walkthrough.gif
          if git diff --cached --quiet; then
            echo "walkthrough.gif already up to date"
            exit 0
          fi
          git commit -m "docs: add real live-demo walkthrough gif"
          git push origin HEAD:${{ github.head_ref }}
