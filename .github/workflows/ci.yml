name: AiFriends CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      AI_MODE: mock
      ENABLE_RAG: 'false'
      ENABLE_ASR: 'false'
      ENABLE_TTS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend scripts
      - name: Course structural grader
        run: python scripts/grade.py --chapter 20
      - name: Django migration drift check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Django checks
        working-directory: backend
        run: python manage.py check
      - name: Django tests
        working-directory: backend
        run: python manage.py test web

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Prepare VAD assets
        run: npm run setup:vad
      - name: Quality check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build smoke test
        run: npm run build

  docker-learning-image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build learning image
        run: docker build -f Dockerfile.learning -t aifriends:learning .

  live-demo-docs-finalize:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/live-demo-screenshots'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Insert bilingual live demo sections
        run: |
          python - <<'PY'
          from pathlib import Path

          demo_url = 'https://app8056.acapp.acwing.com.cn/'
          badge = f'[![Live Demo](https://img.shields.io/badge/Live%20Demo-Open%20AiFriends-2ea44f)]({demo_url})'

          zh = Path('README.md').read_text(encoding='utf-8')
          if badge not in zh:
              zh = zh.replace('[![License: MIT](https://img.shields.io/badge/License-MIT-blue.svg)](./LICENSE)', '[![License: MIT](https://img.shields.io/badge/License-MIT-blue.svg)](./LICENSE)\n' + badge, 1)
          if '# 🌐 在线体验 / Live Demo' not in zh:
