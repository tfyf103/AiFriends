name: AiFriends CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      AI_MODE: mock
      ENABLE_RAG: 'false'
      ENABLE_ASR: 'false'
      ENABLE_TTS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Python dependency security audit
        run: |
          python -m venv /tmp/aifriends-pip-audit
          /tmp/aifriends-pip-audit/bin/python -m pip install --disable-pip-version-check pip-audit==2.10.1
          /tmp/aifriends-pip-audit/bin/pip-audit -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend scripts
      - name: Internationalization and documentation drift
        run: python scripts/check_i18n.py
      - name: Live-demo GIF drift
        run: python scripts/build_demo_gif.py --check
      - name: Course structural grader
        run: python scripts/grade.py --chapter 20
      - name: Django migration drift check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Django checks
        working-directory: backend
        run: python manage.py check
      - name: Django tests
        working-directory: backend
        run: python manage.py test web

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Prepare VAD assets
        run: npm run setup:vad
      - name: Quality check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build smoke test
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      AI_MODE: mock
      ENABLE_RAG: 'false'
      ENABLE_ASR: 'false'
      ENABLE_TTS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Browser E2E dependencies
        run: npm ci --prefix e2e
      - name: Install Playwright Chromium
        run: npm exec --prefix e2e -- playwright install --with-deps chromium
      - name: Browser E2E smoke test
        run: node e2e/browser-smoke.mjs
      - name: Upload Browser E2E screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-e2e-screenshot
          path: e2e/artifacts/
          if-no-files-found: ignore

  docker-learning-image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Build learning image
        run: docker build -f Dockerfile.learning -t aifriends:learning .
