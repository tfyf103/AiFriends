name: Temporary audit documentation sync

on:
  push:
    branches:
      - agent/full-project-audit-fixes

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/full-project-audit-fixes
      - name: Synchronize API and ER documentation
        run: python scripts/sync_audit_docs.py
      - name: Commit documentation changes
        run: |
          if git diff --quiet -- docs/API_REFERENCE.md docs/API_REFERENCE_EN.md docs/DATABASE_ER.md docs/DATABASE_ER_EN.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/API_REFERENCE.md docs/API_REFERENCE_EN.md docs/DATABASE_ER.md docs/DATABASE_ER_EN.md
          git commit -m "docs: align API and ER references with audited behavior"
          git push origin HEAD:agent/full-project-audit-fixes
