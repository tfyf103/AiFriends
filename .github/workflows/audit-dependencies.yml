name: Temporary dependency audit

on:
  push:
    branches:
      - agent/full-project-audit-fixes

permissions:
  contents: write

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/full-project-audit-fixes
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply compatible frontend audit fixes to lockfile
        working-directory: frontend
        run: npm audit fix --package-lock-only
      - name: Verify frontend audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Generate deterministic Browser E2E lockfile
        working-directory: e2e
        run: npm install --package-lock-only
      - name: Verify Browser E2E audit
        working-directory: e2e
        run: npm audit --audit-level=high
      - name: Commit dependency locks if changed
        run: |
          if git diff --quiet -- frontend/package-lock.json e2e/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json e2e/package-lock.json
          git commit -m "fix: lock audited JavaScript dependencies"
          git push origin HEAD:agent/full-project-audit-fixes
