name: Temporary Python dependency audit

on:
  push:
    branches:
      - agent/full-project-audit-fixes

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit pinned requirements
        run: pip-audit -r requirements.txt
