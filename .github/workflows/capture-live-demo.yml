  <img src="./docs/assets/live-demo/login.png" alt="AiFriends live login page" width="49%" />
  <img src="./docs/assets/live-demo/register.png" alt="AiFriends live register page" width="49%" />
</p>

## 公开用户空间

[![AiFriends live public profile](./docs/assets/live-demo/public-profile.png)](https://app8056.acapp.acwing.com.cn/user/space/6)

> 截图是 **2026-08-11 的真实线上快照**。线上内容会随着用户数据和部署版本变化。更详细的验证方法见 [Live Demo Verification](./docs/LIVE_DEMO.md)。

---'''
              if anchor not in zh:
                  raise SystemExit("Chinese README anchor not found")
              zh = zh.replace(anchor, section, 1)
          zh_path.write_text(zh, encoding="utf-8")

          en_path = Path("README_EN.md")
          en = en_path.read_text(encoding="utf-8")
          if badge not in en:
              en = en.replace(
                  "[![License: MIT](https://img.shields.io/badge/License-MIT-blue.svg)](./LICENSE)",
                  "[![License: MIT](https://img.shields.io/badge/License-MIT-blue.svg)](./LICENSE)\n" + badge,
                  1,
              )

          en_marker = "# 🌐 Live Demo"
          if en_marker not in en:
              anchor = "> **Project goal:** help learners go beyond “getting an AI demo to work” and understand why the system is designed this way, how to verify it, how to maintain it, and how to evolve it toward reliable software engineering.\n\n---"
              section = r'''> **Project goal:** help learners go beyond “getting an AI demo to work” and understand why the system is designed this way, how to verify it, how to maintain it, and how to evolve it toward reliable software engineering.

---

# 🌐 Live Demo

