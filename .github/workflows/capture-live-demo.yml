这些图片是某一时刻的真实线上快照，不是设计稿或生成图。公开角色、用户资料、图片和线上部署版本之后都可能变化。
'''
          Path("docs/LIVE_DEMO.md").write_text(live_doc, encoding="utf-8")

          # The raw capture report contained page text used only for verification.
          # Keep the PNG evidence, but avoid retaining unnecessary copied public text.
          Path("docs/assets/live-demo/capture-report.json").unlink(missing_ok=True)
          PY

      - name: Commit finalized demo docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md README_EN.md docs/LIVE_DEMO.md docs/assets/live-demo
          if git diff --cached --quiet; then
            echo "No live-demo documentation changes to commit."
            exit 0
          fi
          git commit -m "docs: add bilingual live demo experience"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
