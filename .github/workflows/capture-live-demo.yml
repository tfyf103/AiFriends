name: Finalize Live Demo Documentation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Add bilingual live demo sections
        run: |
          python - <<'PY'
          from pathlib import Path

          demo_url = "https://app8056.acapp.acwing.com.cn/"
          badge = f"[![Live Demo](https://img.shields.io/badge/Live%20Demo-Open%20AiFriends-2ea44f)]({demo_url})"

          zh_path = Path("README.md")
          zh = zh_path.read_text(encoding="utf-8")
          if badge not in zh:
              zh = zh.replace(
                  "[![License: MIT](https://img.shields.io/badge/License-MIT-blue.svg)](./LICENSE)",
                  "[![License: MIT](https://img.shields.io/badge/License-MIT-blue.svg)](./LICENSE)\n" + badge,
                  1,
              )

          zh_marker = "# 🌐 在线体验 / Live Demo"
          if zh_marker not in zh:
              anchor = "> **项目目标：让学习者不仅“把 AI Demo 跑起来”，还能够理解它为什么这样设计、如何验证它、如何维护它，以及怎样逐步把 Demo 变成可靠的软件工程。**\n\n---"
              section = r'''> **项目目标：让学习者不仅“把 AI Demo 跑起来”，还能够理解它为什么这样设计、如何验证它、如何维护它，以及怎样逐步把 Demo 变成可靠的软件工程。**

---

# 🌐 在线体验 / Live Demo

**实际部署地址：** [https://app8056.acapp.acwing.com.cn/](https://app8056.acapp.acwing.com.cn/)

> 这不是 Mock 截图。2026-08-11，我使用 GitHub-hosted Ubuntu runner + Playwright Chromium 从独立公网环境实际访问线上站点，并以**只读方式**验证首页、登录、注册和公开用户空间；没有为了截图注册测试账号、创建角色或修改生产数据。

公网验证结果：

```text
/                         → HTTP 200
/user/account/login       → HTTP 200
/user/account/register    → HTTP 200
/user/space/6             → HTTP 200
```

## 首页：发现公开 AI Character

[![AiFriends live homepage](./docs/assets/live-demo/homepage.png)](https://app8056.acapp.acwing.com.cn/)

线上首页能够实际加载公开角色与人格描述，验证了公开 Character discovery 路径不是 README 中的静态概念。

## 登录与注册

